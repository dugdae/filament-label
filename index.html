<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Filament Labels</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #16a34a; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b21; --text: #e5e7eb; --muted: #9ca3af;
      --line: #2a2f38; --accent: #3b82f6; --accent-text: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select { width: 100%; padding: 11px 12px; font-size: 16px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  input[type=checkbox] { width: auto; }
  button { padding: 12px 16px; font-size: 16px; font-weight: 600; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .big { width: 100%; padding: 16px; font-size: 18px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  #status { flex: 1; min-width: 0; }
  #status small { display: block; color: var(--muted); }
  .preview { background: #d1d5db; border-radius: 10px; padding: 14px; display: flex; justify-content: center; }
  canvas { width: 100%; max-width: 380px; height: auto; background: #fff; image-rendering: pixelated;
    box-shadow: 0 1px 4px rgba(0,0,0,.25); border-radius: 3px; }
  .warn { background: #fef3c7; color: #78350f; border-color: #fcd34d; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  #log { font: 12px/1.4 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap;
    max-height: 140px; overflow: auto; margin-top: 10px; }
  .recent { display: flex; gap: 8px; flex-wrap: wrap; }
  .recent button { padding: 8px 12px; font-size: 14px; font-weight: 500; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Filament Labels · NIIMBOT</h1>

  <div id="noBt" class="card warn hidden">
    This browser can't use Bluetooth. Open this page in <b>Chrome on Android</b> over <b>https://</b>.
  </div>

  <!-- 1. Connection -->
  <section class="card">
    <h2>1 · Printer</h2>
    <div class="row">
      <span id="dot" class="dot"></span>
      <div id="status">Not connected<small>Tap Connect, then pick your B1 PRO from the list</small></div>
      <button id="btnConnect" class="primary">Connect</button>
      <button id="btnDisconnect" class="hidden">Disconnect</button>
    </div>
  </section>

  <!-- 2. Label data -->
  <section class="card">
    <h2>2 · Filament</h2>
    <div class="grid">
      <div class="full">
        <label for="fTitle">Title / brand</label>
        <input id="fTitle" value="R3D" autocomplete="off">
      </div>
      <div class="full">
        <label for="fColor">Filament color (printed in the box)</label>
        <input id="fColor" placeholder="e.g. PLA Matte Black" autocomplete="off">
      </div>
      <div>
        <label for="fCost">Cost</label>
        <input id="fCost" inputmode="decimal" placeholder="e.g. 390" autocomplete="off">
      </div>
      <div>
        <label for="fCurrency">Currency</label>
        <input id="fCurrency" placeholder="e.g. ฿, $, THB" autocomplete="off">
      </div>
      <div>
        <label for="fDate">Purchased</label>
        <input id="fDate" type="date">
      </div>
      <div>
        <label for="fDateFmt">Date format</label>
        <select id="fDateFmt">
          <option value="dmy">12/10/2026</option>
          <option value="dMy">12 Oct 2026</option>
          <option value="iso">2026-10-12</option>
          <option value="mdy">10/12/2026</option>
        </select>
      </div>
      <div class="full">
        <label class="row" style="color:var(--text); flex-wrap:nowrap">
          <input id="fEmptyBox" type="checkbox"> Leave the box empty (write / stick sample by hand)
        </label>
      </div>
    </div>
    <div id="recentWrap" class="hidden" style="margin-top:14px">
      <label>Recent</label>
      <div id="recent" class="recent"></div>
    </div>
  </section>

  <!-- 3. Preview + print -->
  <section class="card">
    <h2>3 · Preview &amp; print</h2>
    <div class="preview"><canvas id="cv"></canvas></div>
    <p class="hint" id="sizeHint"></p>
    <div class="grid" style="margin-top:12px">
      <div>
        <label for="fQty">Copies</label>
        <input id="fQty" type="number" min="1" max="50" value="1">
      </div>
      <div>
        <label for="fDensity">Darkness (1–5)</label>
        <select id="fDensity">
          <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
        </select>
      </div>
    </div>
    <button id="btnPrint" class="primary big" style="margin-top:14px" disabled>Print</button>

    <details style="margin-top:14px">
      <summary>Advanced (label size, resolution, log)</summary>
      <div class="grid" style="margin-top:12px">
        <div><label for="fW">Label width (mm)</label><input id="fW" type="number" value="40"></div>
        <div><label for="fH">Label height (mm)</label><input id="fH" type="number" value="30"></div>
        <div><label for="fDpi">DPI (B1 PRO = 300)</label><input id="fDpi" type="number" value="300"></div>
        <div>
          <label for="fDir">Print direction</label>
          <select id="fDir"><option value="auto">Auto</option><option value="top">top</option><option value="left">left</option></select>
        </div>
      </div>
      <div id="log"></div>
    </details>
  </section>
</main>

<script src="https://unpkg.com/@mmote/niimbluelib@0.47.0/dist/umd/niimbluelib.min.js"></script>
<script>
(() => {
  const NB = window.niimbluelib;
  const $ = (id) => document.getElementById(id);
  const cv = $("cv");
  const FIELDS = ["fTitle", "fColor", "fCost", "fCurrency", "fDateFmt", "fEmptyBox", "fQty", "fDensity", "fW", "fH", "fDpi", "fDir"];
  const STORE_KEY = "filamentLabel.v1";
  let client = null;
  let busy = false;

  // ---------- storage (per-device convenience only) ----------
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } };
  const save = (data) => { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch {} };

  const restore = () => {
    const s = load();
    for (const id of FIELDS) {
      if (s[id] === undefined) continue;
      if ($(id).type === "checkbox") $(id).checked = s[id]; else $(id).value = s[id];
    }
    $("fDate").value = new Date().toISOString().slice(0, 10);
    renderRecent();
  };
  const persist = () => {
    const s = load();
    for (const id of FIELDS) s[id] = $(id).type === "checkbox" ? $(id).checked : $(id).value;
    save(s);
  };

  // ---------- log ----------
  const log = (msg) => { console.log(msg); $("log").textContent += msg + "\n"; $("log").scrollTop = 1e9; };

  // ---------- label rendering ----------
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fmtDate = (iso, fmt) => {
    if (!iso) return "";
    const [y, m, d] = iso.split("-");
    if (fmt === "iso") return iso;
    if (fmt === "mdy") return `${m}/${d}/${y}`;
    if (fmt === "dMy") return `${+d} ${MONTHS[+m - 1]} ${y}`;
    return `${d}/${m}/${y}`;
  };
  const fmtCost = (cost, cur) => {
    cost = cost.trim(); cur = cur.trim();
    if (!cost) return "";
    if (!cur) return cost;
    return /^[^\w\s]{1,2}$/u.test(cur) ? cur + cost : `${cost} ${cur}`; // symbol before, code after
  };

  // Largest font size (<= max) at which text fits maxWidth.
  const fitFont = (ctx, text, weight, max, maxWidth) => {
    let size = max;
    do { ctx.font = `${weight} ${size}px system-ui, Roboto, "Segoe UI", Arial, sans-serif`; size -= 1; }
    while (size > 6 && ctx.measureText(text).width > maxWidth);
    return size + 1;
  };

  // Wrap into at most 2 lines if one line would be too small.
  const drawBoxText = (ctx, text, x, y, w, h, u) => {
    const pad = 14 * u;
    const maxW = w - pad * 2;
    const one = fitFont(ctx, text, 700, Math.min(150 * u, h * 0.62), maxW);
    const words = text.split(/\s+/);
    if (one < 80 * u && words.length > 1) {
      let best = null;
      for (let i = 1; i < words.length; i++) {
        const a = words.slice(0, i).join(" "), b = words.slice(i).join(" ");
        const size = Math.min(fitFont(ctx, a, 700, h * 0.36, maxW), fitFont(ctx, b, 700, h * 0.36, maxW));
        if (!best || size > best.size) best = { a, b, size };
      }
      if (best && best.size > one) {
        ctx.font = `700 ${best.size}px system-ui, Roboto, "Segoe UI", Arial, sans-serif`;
        ctx.fillText(best.a, x + w / 2, y + h / 2 - best.size * 0.55);
        ctx.fillText(best.b, x + w / 2, y + h / 2 + best.size * 0.55);
        return;
      }
    }
    fitFont(ctx, text, 700, Math.min(150 * u, h * 0.62), maxW);
    ctx.fillText(text, x + w / 2, y + h / 2);
  };

  const render = () => {
    const dpi = +$("fDpi").value || 300;
    const W = Math.round((+$("fW").value || 40) / 25.4 * dpi);
    const H = Math.round((+$("fH").value || 30) / 25.4 * dpi);
    cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    const u = W / 1080; // design units: template drawn on a 1080-wide grid
    const v = H / 810;

    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#000"; ctx.strokeStyle = "#000";
    ctx.textBaseline = "middle";

    // Title
    const title = $("fTitle").value.trim();
    ctx.textAlign = "center";
    fitFont(ctx, title, 700, 120 * u, W - 80 * u);
    ctx.fillText(title, W / 2, 98 * v);

    // Box
    const bx = 48 * u, by = 180 * v, bw = W - 96 * u, bh = 365 * v;
    ctx.lineWidth = Math.max(2, Math.round(7 * u));
    ctx.strokeRect(bx, by, bw, bh);
    const color = $("fColor").value.trim();
    if (color && !$("fEmptyBox").checked) drawBoxText(ctx, color, bx, by, bw, bh, u);

    // Cost / Purchased lines
    ctx.textAlign = "left";
    const lx = 80 * u, maxW = W - lx - 40 * u;
    const lines = [
      ["Cost - ", fmtCost($("fCost").value, $("fCurrency").value), 625 * v],
      ["Purchased - ", fmtDate($("fDate").value, $("fDateFmt").value), 735 * v],
    ];
    for (const [label, value, y] of lines) {
      const size = Math.min(fitFont(ctx, label + value, 700, 78 * u, maxW), 78 * u);
      ctx.font = `500 ${size}px system-ui, Roboto, "Segoe UI", Arial, sans-serif`;
      ctx.fillText(label, lx, y);
      const lw = ctx.measureText(label).width;
      ctx.font = `700 ${size}px system-ui, Roboto, "Segoe UI", Arial, sans-serif`;
      ctx.fillText(value, lx + lw, y);
    }

    // Hard threshold: the printer prints every non-white pixel black, so remove anti-alias grey.
    const img = ctx.getImageData(0, 0, W, H), p = img.data;
    for (let i = 0; i < p.length; i += 4) {
      const lum = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
      const c = lum < 150 ? 0 : 255;
      p[i] = p[i + 1] = p[i + 2] = c; p[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);

    $("sizeHint").textContent = `${$("fW").value} × ${$("fH").value} mm · ${W} × ${H} px @ ${dpi} dpi`;
  };

  // ---------- recent entries ----------
  const renderRecent = () => {
    const list = load().recent || [];
    $("recentWrap").classList.toggle("hidden", !list.length);
    $("recent").innerHTML = "";
    for (const r of list) {
      const b = document.createElement("button");
      b.textContent = r.color || r.title;
      b.onclick = () => {
        $("fTitle").value = r.title; $("fColor").value = r.color;
        $("fCost").value = r.cost; $("fCurrency").value = r.currency;
        if (r.date) $("fDate").value = r.date;
        render();
      };
      $("recent").appendChild(b);
    }
  };
  const remember = () => {
    const s = load();
    const entry = { title: $("fTitle").value, color: $("fColor").value, cost: $("fCost").value,
      currency: $("fCurrency").value, date: $("fDate").value };
    s.recent = [entry, ...(s.recent || []).filter((r) => r.color !== entry.color || r.title !== entry.title)].slice(0, 8);
    save(s); renderRecent();
  };

  // ---------- printer connection ----------
  const setStatus = (main, sub, on) => {
    $("status").innerHTML = "";
    $("status").append(main);
    const small = document.createElement("small"); small.textContent = sub || ""; $("status").append(small);
    $("dot").classList.toggle("on", !!on);
  };
  const refreshButtons = () => {
    const connected = !!client && client.isConnected();
    $("btnConnect").classList.toggle("hidden", connected);
    $("btnDisconnect").classList.toggle("hidden", !connected);
    $("btnPrint").disabled = !connected || busy;
  };

  const connect = async () => {
    if (client) { try { await client.disconnect(); } catch {} }
    client = NB.instantiateClient("bluetooth");
    client.on("connect", () => {
      const meta = client.getModelMetadata();
      const info = client.getPrinterInfo();
      if (meta) {
        $("fDpi").value = meta.dpi;
        render();
      }
      const name = meta ? meta.model.replace("_", " ") : "Unknown model";
      const bat = info.batteryPercents !== undefined ? ` · battery ${info.batteryPercents}%` : "";
      setStatus(`Connected: ${name}`, `${meta ? meta.dpi + " dpi" : ""}${bat} · task ${client.getPrintTaskType() || "?"}`, true);
      log(`connected model=${meta && meta.model} task=${client.getPrintTaskType()} dir=${meta && meta.printDirection}`);
      refreshButtons();
    });
    client.on("disconnect", () => {
      setStatus("Not connected", "Tap Connect, then pick your B1 PRO from the list", false);
      log("disconnected");
      refreshButtons();
    });
    client.on("printprogress", (e) => {
      $("btnPrint").textContent = `Printing ${e.page}/${e.pagesTotal} · ${e.pagePrintProgress}%`;
    });
    try {
      setStatus("Connecting…", "Choose the printer in the Bluetooth list", false);
      await client.connect();
    } catch (e) {
      log("connect error: " + e);
      setStatus("Not connected", String(e.message || e), false);
      refreshButtons();
    }
  };

  const print = async () => {
    if (!client || busy) return;
    busy = true; refreshButtons();
    render();
    const meta = client.getModelMetadata();
    const taskName = client.getPrintTaskType() || "D110M_V4";
    const dir = $("fDir").value === "auto" ? (meta ? meta.printDirection : "top") : $("fDir").value;
    const qty = Math.max(1, Math.min(50, +$("fQty").value || 1));
    const encoded = NB.ImageEncoder.encodeCanvas(cv, NB.PageColorType.SingleColor, dir);
    const task = client.protocol.newPrintTask(taskName, {
      totalPages: qty,
      density: +$("fDensity").value,
      pageColor: NB.PageColorType.SingleColor,
      statusPollIntervalMs: 100,
      statusTimeoutMs: 8000,
    });
    log(`print task=${taskName} dir=${dir} qty=${qty} ${cv.width}x${cv.height}`);
    try {
      await task.printInit();
      await task.printPage(encoded, qty);
      await task.waitForPageFinished();
      await task.waitForFinished();
      remember();
      log("print done");
    } catch (e) {
      log("print error: " + e);
      alert("Print failed: " + (e.message || e));
    } finally {
      try { await task.printEnd(); } catch {}
      busy = false;
      $("btnPrint").textContent = "Print";
      refreshButtons();
    }
  };

  // ---------- wire up ----------
  if (!navigator.bluetooth) {
    $("noBt").classList.remove("hidden");
    $("btnConnect").disabled = true;
  }
  if (!NB) {
    $("noBt").classList.remove("hidden");
    $("noBt").textContent = "Couldn't load the printer library (needs internet the first time).";
  }
  $("btnConnect").onclick = connect;
  $("btnDisconnect").onclick = () => client && client.disconnect();
  $("btnPrint").onclick = print;
  document.querySelectorAll("input, select").forEach((el) =>
    el.addEventListener("input", () => { render(); persist(); }));

  restore();
  render();
})();
</script>
</body>
</html>
